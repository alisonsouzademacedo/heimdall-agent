name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Versao do PowerShell (informativo)
        run: command -v pwsh && pwsh --version || echo "pwsh nao encontrado"
      - name: Rodar todos os testes
        run: REQUIRE_PWSH=1 REQUIRE_NODE=1 sh tests/run-all.sh

  # Windows e onde o dono usa o Heimdall: tres erros reais da 1a rodada so apareceram la (docs/plano/LICOES.md, 2026-10-19).
  # Node 22 (minimo do projeto) e 24 (o que o winget instala hoje). Cobre o nucleo, a higiene e os testes do instalador no Windows;
  # os demais conjuntos de shell continuam so no Ubuntu.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        shell: bash
    steps:
      # O ZIP que o dono baixa vem com fim de linha LF: o executor nao deve converter para CRLF antes do checkout.
      - name: Manter fim de linha LF (como no ZIP do dono)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Testes do nucleo
        working-directory: apps/core
        run: npm test
      - name: Higiene do repositorio
        run: sh tests/repo/check_higiene.sh
      - name: Testes do listener (Baileys)
        working-directory: apps/listener
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
      - name: Testes do executor (trabalhos)
        working-directory: apps/trabalhos
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
      - name: Testes da memoria (Hindsight)
        working-directory: apps/memoria
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
      - name: Testes da ponte (Hermes)
        working-directory: apps/ponte
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
      - name: Instalador - virtualizacao e WSL
        run: REQUIRE_PWSH=1 sh tests/instalar/check_ambiente_windows.sh
      - name: Instalador - assinatura digital (so roda no Windows)
        run: REQUIRE_PWSH=1 sh tests/instalar/check_assinatura.sh
      - name: Instalador - reparo do Docker com socket preso
        run: REQUIRE_PWSH=1 sh tests/instalar/check_docker_reparo.sh
      - name: Instalador - Docker aberto fora do app Claude
        run: REQUIRE_PWSH=1 sh tests/instalar/check_fora_do_pacote.sh
